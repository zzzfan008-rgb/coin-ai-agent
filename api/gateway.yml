openapi: 3.0.3
info:
  title: Fashion AI Platform — API Gateway
  description: |
    Go API Gateway for Fashion AI Platform.
    - JWT 认证（HS256）
    - OpenAI 兼容端点（/v1/chat/completions）
    - WebSocket 实时对话（/ws/chat）
    - 粗粒度 RBAC 路由权限
    - 请求速率限制（Redis）
    - 审计日志中间件
  version: 1.0.0
  contact:
    name: Fashion AI Team

servers:
  - url: http://localhost:8080
    description: Local development

security:
  - BearerAuth: []

tags:
  - name: auth
    description: 认证接口（无需认证）
  - name: chat
    description: OpenAI 兼容对话接口
  - name: users
    description: 用户管理
  - name: depts
    description: 部门管理
  - name: roles
    description: 角色管理
  - name: sessions
    description: 会话管理
  - name: health
    description: 健康检查

paths:
  /health:
    get:
      tags: [health]
      summary: 健康检查
      security: []
      responses:
        '200':
          description: 服务健康
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  # ── Auth ──────────────────────────────────────────────────────────────────

  /auth/register:
    post:
      tags: [auth]
      summary: 用户注册（同时创建组织和默认部门）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: 用户名已存在

  /auth/login:
    post:
      tags: [auth]
      summary: 用户登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ── OpenAI Compatible ──────────────────────────────────────────────────────

  /v1/models:
    get:
      tags: [chat]
      summary: 模型列表
      responses:
        '200':
          description: 模型列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelList'

  /v1/chat/completions:
    post:
      tags: [chat]
      summary: 对话补全（OpenAI 兼容）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
      responses:
        '200':
          description: 对话响应
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletionResponse'
            text/event-stream:
              schema:
                type: string
                example: 'data: {"id":"chatcmpl_xxx","choices":[{"delta":{"content":"你好"}}]}'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ── WebSocket ──────────────────────────────────────────────────────────────

  /ws/chat:
    get:
      tags: [chat]
      summary: WebSocket 实时对话
      description: |
        通过 WebSocket 进行实时双向对话。
        认证方式：`?token=<jwt_token>`
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
          description: JWT token
      responses:
        '101':
          description: Switching Protocols — WebSocket 升级成功
        '401':
          description: Token 无效

  # ── Users ──────────────────────────────────────────────────────────────────

  /api/users:
    get:
      tags: [users]
      summary: 用户列表（仅管理员）
      responses:
        '200':
          description: 用户列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ── Departments ────────────────────────────────────────────────────────────

  /api/depts:
    get:
      tags: [depts]
      summary: 部门列表
      responses:
        '200':
          description: 部门列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeptList'
    post:
      tags: [depts]
      summary: 创建部门
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeptRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dept'

  # ── Roles ──────────────────────────────────────────────────────────────────

  /api/roles:
    get:
      tags: [roles]
      summary: 角色列表
      responses:
        '200':
          description: 角色列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleList'
    post:
      tags: [roles]
      summary: 创建角色
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'

  # ── Sessions ───────────────────────────────────────────────────────────────

  /api/sessions:
    get:
      tags: [sessions]
      summary: 会话列表
      parameters:
        - name: archived
          in: query
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: 会话列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionList'
    post:
      tags: [sessions]
      summary: 创建会话
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'

  /api/sessions/{id}:
    get:
      tags: [sessions]
      summary: 获取会话详情
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: 会话详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [sessions]
      summary: 更新会话（如归档）
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSessionRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'

  /api/sessions/{id}/messages:
    get:
      tags: [sessions]
      summary: 获取会话消息历史
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: before
          in: query
          schema:
            type: string
          description: 游标（最后一条消息的 id）
      responses:
        '200':
          description: 消息列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageList'
        '404':
          $ref: '#/components/responses/NotFound'

# ── Components ────────────────────────────────────────────────────────────────

components:

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    SessionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:

    # ── Auth ──────────────────────────────────────────────────────────────────

    RegisterRequest:
      type: object
      required: [username, password, org_name, dept_name]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 100
        password:
          type: string
          minLength: 6
        display_name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
        org_name:
          type: string
          maxLength: 255
        dept_name:
          type: string
          maxLength: 255

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        dept_id:
          type: string
          format: uuid
        username:
          type: string
        display_name:
          type: string
        role:
          type: string
          enum: [admin, designer, viewer]
        token:
          type: string

    # ── Chat ──────────────────────────────────────────────────────────────────

    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [system, user, assistant, tool]
        content:
          type: string

    ChatCompletionRequest:
      type: object
      required: [model, messages]
      properties:
        model:
          type: string
          example: gpt-4o
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
        stream:
          type: boolean
          default: false
        temperature:
          type: number
          minimum: 0
          maximum: 2
          default: 0.7
        max_tokens:
          type: integer
          minimum: 1
        extra_body:
          type: object
          properties:
            session_id:
              type: string
            skill_ids:
              type: array
              items:
                type: string
            mcp_server_ids:
              type: array
              items:
                type: string
            knowledge_collections:
              type: array
              items:
                type: string

    ChatCompletionResponse:
      type: object
      properties:
        id:
          type: string
        object:
          type: string
          enum: [chat.completion]
        created:
          type: integer
          format: int64
        model:
          type: string
        choices:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              message:
                type: object
                properties:
                  role:
                    type: string
                  content:
                    type: string
              finish_reason:
                type: string
        usage:
          type: object
          properties:
            prompt_tokens:
              type: integer
            completion_tokens:
              type: integer
            total_tokens:
              type: integer

    ModelList:
      type: object
      properties:
        object:
          type: string
          enum: [list]
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              object:
                type: string
                enum: [model]
              created:
                type: integer
              owned_by:
                type: string

    # ── Users ─────────────────────────────────────────────────────────────────

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        display_name:
          type: string
        email:
          type: string
        dept_id:
          type: string
          format: uuid
        dept_name:
          type: string
        role:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time

    UserList:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'
        total:
          type: integer

    # ── Departments ───────────────────────────────────────────────────────────

    Dept:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        parent_id:
          type: string
          format: uuid
          nullable: true
        path:
          type: string
        created_at:
          type: string
          format: date-time

    DeptList:
      type: object
      properties:
        depts:
          type: array
          items:
            $ref: '#/components/schemas/Dept'

    CreateDeptRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 255
        parent_id:
          type: string
          format: uuid

    # ── Roles ─────────────────────────────────────────────────────────────────

    Role:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        permissions:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time

    RoleList:
      type: object
      properties:
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'

    CreateRoleRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
        permissions:
          type: array
          items:
            type: string
          default: []

    # ── Sessions ───────────────────────────────────────────────────────────────

    Session:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        is_archived:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SessionList:
      type: object
      properties:
        sessions:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              title:
                type: string
              is_archived:
                type: boolean
              message_count:
                type: integer
              created_at:
                type: string
                format: date-time
              updated_at:
                type: string
                format: date-time
        total:
          type: integer

    CreateSessionRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 500

    UpdateSessionRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 500
        is_archived:
          type: boolean

    # ── Messages ───────────────────────────────────────────────────────────────

    Message:
      type: object
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
          enum: [user, assistant, system, tool]
        content:
          type: string
        model:
          type: string
          nullable: true
        token_count:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time

    MessageList:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        has_more:
          type: boolean
        next_cursor:
          type: string
          nullable: true

    # ── Health ─────────────────────────────────────────────────────────────────

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded, down]
        version:
          type: string
        services:
          type: object
          properties:
            database:
              type: string
            redis:
              type: string
            rust_core:
              type: string

    # ── Errors ─────────────────────────────────────────────────────────────────

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true

  responses:
    BadRequest:
      description: 请求参数错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Unauthorized:
      description: 未认证或 Token 无效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Forbidden:
      description: 无权限
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
