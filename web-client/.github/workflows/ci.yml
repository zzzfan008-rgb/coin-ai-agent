name: web-client

on:
  push:
    branches: [main]
    paths:
      - 'web-client/**'
  pull_request:
    branches: [main]
    paths:
      - 'web-client/**'

jobs:
  gate:
    name: Typecheck · Lint · Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'web-client/node_modules'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test
