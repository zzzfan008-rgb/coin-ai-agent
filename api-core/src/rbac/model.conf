# =============================================================================
# Fashion AI Platform — Casbin RBAC Model (T-017)
# Request/policy are 5-tuples: (sub, role, dept, obj, act)
#   sub = user_id   role = user role   dept = dept_id
#   obj = resource  act = action
# =============================================================================

[request_definition]
r = sub, role, dept, obj, act

[policy_definition]
p = sub, role, dept, obj, act

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = (r.sub == p.sub || p.sub == "*") && (r.role == p.role || p.role == "*") && (r.dept == p.dept || p.dept == "*") && (r.obj == p.obj || p.obj == "*") && (r.act == p.act || p.act == "*")
