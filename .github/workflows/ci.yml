# Coin-AI 平台 CI — 三个服务并行构建 + 测试
# api-core (Rust) / api-gateway (Go) / web-client (Vite+React)
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-core:
    name: api-core (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: api-core

      - name: Check formatting
        run: cargo fmt --check || echo "::warning::cargo fmt 有差异（不阻塞）"

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings || echo "::warning::clippy 有告警（不阻塞）"

      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test --release

  api-gateway:
    name: api-gateway (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-gateway
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.24"
          cache-dependency-path: api-gateway/go.sum

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -o /tmp/gateway-server ./cmd/server/

      - name: Test
        run: go test ./...

  web-client:
    name: web-client (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-client
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-client/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck + Build
        run: npm run build

      - name: Test
        run: npm test
